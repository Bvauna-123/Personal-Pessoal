<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Personal Pessoal</title>
    
    <!-- Tailwind CSS para o estilo -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
<style>
  :root {
    --bg-pure: #000000;
    --accent-a: #00f2ff; /* Ciano Neon */
    --accent-b: #7000ff; /* Roxo Elétrico */
    --accent-c: #adff2f; /* Verde Lima */
    --card-surface: #0a0a0a;
  }
  
  body {
    background-color: var(--bg-pure);
    font-family: 'Inter', sans-serif;
    letter-spacing: -0.02em;
  }

  /* Efeito de Gradiente Suave no Fundo */
  .bg-glow {
    background: radial-gradient(circle at 50% -20%, #1a1a1a 0%, #000 100%);
  }

  /* Animação de Pulsar para Itens Ativos */
  @keyframes pulse-soft {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .active-pulse { animation: pulse-soft 2s infinite; }
</style>
</head>
<body>
    <!-- O React vai montar o App dentro desta div -->
    <div id="root"></div>

    <!-- Ponto de entrada do script -->
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
